version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      # 1. root 비밀번호 설정
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 2. 사용할 DB 이름 생성
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # 3. 사용할 일반 사용자 생성 (properties와 일치)
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    image: dlho1222/backend-app:latest
    container_name: spring-api
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # 중요: IP 주소(192.168...) 대신 도커 서비스 이름인 'db'를 사용해야 합니다.
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      FILE_UPLOAD_DIR: /app/uploads
    # 파일 업로드를 사용하신다면 아래 볼륨 설정도 유용합니다.
    volumes:
      - ./uploads:/app/uploads

  frontend:
    image: dlho1222/frontend-app:latest
    container_name: react-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: