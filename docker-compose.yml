# docker-compose.yml
version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: my_project_db
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  backend:
    image: your-docker-id/backend-image:latest
    container_name: spring-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/my_project_db?useSSL=false

  frontend:
    image: your-docker-id/frontend-image:latest
    container_name: react-web
    ports:
      - "80:80"
    depends_on:
      - backend