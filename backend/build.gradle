plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '1.8.2'
    id 'org.spdx.sbom' version '0.7.0'
    id 'org.owasp.dependencycheck' version '9.0.9'
}

group = 'com.finss'
version = '0.0.1-SNAPSHOT'
description = 'backend'


sourceCompatibility = '17'
targetCompatibility = '17'

// java {
//     toolchain {
//         languageVersion = JavaLanguageVersion.of(17)
//     }
// }

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- SCA 실습용 의도적 취약 의존성 추가 ---
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.0'
    implementation 'org.springframework:spring-webmvc:5.3.17'
    implementation 'org.apache.commons:commons-collections4:4.0'
    implementation 'org.apache.poi:poi:3.17'
    implementation 'org.apache.poi:poi-ooxml:3.17'
    implementation 'com.h2database:h2:1.4.199'
    implementation 'org.apache.tika:tika-core:1.24.1'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Security 추가
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // DB 테이블 - Java Entity 자동 매핑 / CRUD 코드 최소화, Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    //어노테이션 사용
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.mysql:mysql-connector-j'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyCheck {
       autoUpdate = false        // 인터넷 접속 차단
       failOnError = false       // 분석 실패해도 빌드는 성공시킴 (결과 확인용)
       format = 'JSON'           // 우리가 필요한 JSON 형식
   }

tasks.named('test') {
    useJUnitPlatform()
}
