version: '3.8'

services:
  dtrack-apiserver:
    image: dependencytrack/apiserver:latest
    container_name: dtrack-apiserver
    ports:
      - "8089:8080"
    volumes:
      - dtrack_data:/data
    environment:
      # 초기 부팅 시 대량의 CVE 다운로드 작업을 비활성화하여 VM 과부하 및 다운을 방지합니다.
      - ALPINE_NVD_FEEDS_ENABLED=false
      - ALPINE_NIST_FEEDS_ENABLED=false
    restart: unless-stopped

  dtrack-frontend:
    image: dependencytrack/frontend:latest
    container_name: dtrack-frontend
    depends_on:
      - dtrack-apiserver
    environment:
      # 중요: 윈도우 브라우저에서 접속할 때 API 서버를 찾아갈 수 있도록 
      # localhost 대신 [리눅스 VM의 IP 주소]를 적어주어야 합니다.
      # 예: http://192.168.111.xxx:8081
      - API_BASE_URL=http://192.168.111.130:8089
    ports:
      - "8082:8080"
    restart: unless-stopped

volumes:
  dtrack_data:
